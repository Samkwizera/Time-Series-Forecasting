# Central configuration for the Milan traffic forecasting project.
# Every script reads this file; override values with --config or environment variable MILAN_CONFIG.

paths:
  raw_dir: data/raw                 # 62 daily TSV files from Harvard Dataverse
  interim_dir: data/interim         # per-day aggregated Parquet (country codes summed)
  processed_dir: data/processed     # wide hourly tensors used for EDA and modelling
  figures_dir: reports/figures
  tables_dir: reports/tables
  experiments_dir: experiments
  models_dir: models

data:
  # Schema of the raw TSV files (no header row). Column order is fixed by the data provider.
  raw_columns: [square_id, time_interval, country_code, sms_in, sms_out, call_in, call_out, internet]
  activities: [sms_in, sms_out, call_in, call_out, internet]
  n_cells: 10000
  grid_side: 100
  interval_minutes: 10
  timezone: Europe/Rome
  start_date: "2013-11-01"
  end_date: "2014-01-01"          # inclusive; 62 daily files
  # Set to a small integer while developing to ingest only the first N daily files.
  max_days: null
  chunk_rows: 2_000_000           # rows per chunk when streaming a TSV with pandas

eda:
  hourly_freq: "1h"
  n_clusters: 4                   # k-means on normalised 24h profiles (business / residential / nightlife / mixed)
  # Landmark cells used in prior work on this dataset (Barlacchi et al. 2015 companion notebooks).
  landmarks:
    duomo: 5060
    bocconi: 4259
    navigli: 4456
  n_cells_per_cluster: 1

forecast:
  target_activity: internet
  input_window: 168               # hours of history fed to the models (one week)
  horizons: [1, 6, 24]            # hours ahead
  split:
    train_end: "2013-12-14 23:00"
    val_end: "2013-12-21 23:00"   # test = 2013-12-22 .. 2014-01-01 (holiday period, deliberately hard)
  transform: log1p
  seed: 42
