# Central config; every script reads this. Override with --config or MILAN_CONFIG.

paths:
  # the 62 daily TSV files from Harvard Dataverse
  raw_dir: data/raw
  # per-day Parquet with country codes summed away
  interim_dir: data/interim
  # hourly (time x cell) matrices used for EDA and modelling
  processed_dir: data/processed
  figures_dir: reports/figures
  tables_dir: reports/tables
  experiments_dir: experiments
  models_dir: models

data:
  # column order is fixed by the provider; the files have no header row
  raw_columns: [square_id, time_interval, country_code, sms_in, sms_out, call_in, call_out, internet]
  activities: [sms_in, sms_out, call_in, call_out, internet]
  n_cells: 10000
  grid_side: 100
  interval_minutes: 10
  timezone: Europe/Rome
  start_date: "2013-11-01"
  # inclusive
  end_date: "2014-01-01"
  # set to a small number while developing to only ingest the first N days
  max_days: null
  # rows per chunk for the pandas fallback engine
  chunk_rows: 2_000_000

eda:
  hourly_freq: "1h"
  # k-means on normalised 24h profiles; 4 tends to give business / residential / nightlife / mixed
  n_clusters: 4
  # well-known cells from the Barlacchi et al. companion notebooks
  landmarks:
    duomo: 5060
    bocconi: 4259
    navigli: 4456
  n_cells_per_cluster: 1

forecast:
  target_activity: internet
  # one week of history
  input_window: 168
  # hours ahead
  horizons: [1, 6, 24]
  split:
    train_end: "2013-12-14 23:00"
    # test = 22 Dec .. 1 Jan, i.e. the holiday period; hard on purpose
    val_end: "2013-12-21 23:00"
  transform: log1p
  seed: 42
